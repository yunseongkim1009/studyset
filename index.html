<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StudySet — your study set</title>
<link rel="stylesheet" href="suite.css">
<style>
  .hero { padding: 34px 0 18px; }
  .hero .h1 { font-size: clamp(30px, 5vw, 48px); }
  .greet { color: var(--accent); font-weight: 700; }

  .kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin: 10px 0 34px; }
  .kpi { padding: 18px 18px 16px; display:flex; flex-direction:column; gap:3px; position:relative; overflow:hidden; text-decoration:none; color:inherit; }
  .kpi::after { content:""; position:absolute; left:0; top:0; height:100%; width:3px; background:var(--tone,var(--accent)); opacity:.9; }
  .kpi .n { font-family: var(--serif); font-size: 40px; font-weight: 600; line-height: 1; letter-spacing:-1px; margin-top:4px; }
  .kpi .l { color: var(--muted); font-size: 13px; font-weight:500; }
  .kpi .ic { width:34px; height:34px; border-radius:10px; display:grid; place-items:center; color:var(--tone,var(--accent));
    background: color-mix(in srgb, var(--tone,var(--accent)) 13%, var(--card)); border:1px solid color-mix(in srgb, var(--tone,var(--accent)) 22%, transparent); }
  .kpi.tone-accent{ --tone:var(--accent); } .kpi.tone-gold{ --tone:var(--gold); }
  .kpi.tone-rose{ --tone:var(--rose); } .kpi.tone-green{ --tone:var(--green); }
  .kpi.tone-rose .n, .kpi.tone-gold .n { color: var(--tone); }

  .apps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .app-card { padding: 22px; text-decoration: none; color: inherit; display:flex; flex-direction:column; gap:7px; position:relative; overflow:hidden; }
  .app-card::before { content:""; position:absolute; inset:0; background:radial-gradient(120% 80% at 100% 0%, var(--accent-wash), transparent 55%); opacity:0; transition:opacity .25s; }
  .app-card:hover::before { opacity:.7; }
  .app-card > * { position:relative; }
  .app-card .glyph { width:50px; height:50px; border-radius:15px; display:grid; place-items:center; color:#fff;
    background: linear-gradient(150deg, var(--accent-2), var(--accent) 60%, var(--accent-deep)); box-shadow: var(--sh-2), inset 0 1px 0 rgba(255,255,255,.3); }
  .app-card h3 { margin:8px 0 0; font-family:var(--serif); font-size:21px; font-weight:600; letter-spacing:-.3px; }
  .app-card p { margin:0; color: var(--muted); font-size:14px; line-height:1.5; }
  .app-card .app-go { margin-top:6px; display:inline-flex; align-items:center; gap:6px; font-size:13px; font-weight:600; color:var(--accent);
    opacity:0; transform:translateX(-4px); transition:opacity .2s, transform .2s var(--out); }
  .app-card:hover .app-go { opacity:1; transform:translateX(0); }
  .app-card .badge2 { position:absolute; right:16px; top:16px; }

  .side { display:grid; grid-template-columns: 1.4fr 1fr; gap:22px; margin-top:30px; align-items:start; }
  .activity-item { display:flex; gap:10px; align-items:center; padding:9px 0; border-bottom:1px solid var(--line-soft); font-size:14px; }
  .activity-item .ai { width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--card-2);border:1px solid var(--line);flex:none;color:var(--accent); }
  .subj-chip { display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;margin:0 6px 6px 0; }
  .subj-chip button { border:none;background:transparent;color:var(--muted);cursor:pointer;padding:0 0 0 2px;font-size:14px; }

  @media (max-width: 900px){ .kpis{grid-template-columns:repeat(2,1fr);} .apps{grid-template-columns:1fr 1fr;} .side{grid-template-columns:1fr;} }
  @media (max-width: 560px){ .apps{grid-template-columns:1fr;} }
</style>
</head>
<body>
<script src="suite.js"></script>
<div class="wrap">
  <header class="hero">
    <div class="eyebrow">StudySet · your complete study toolkit</div>
    <h1 class="h1"><span class="greet" id="greet">Hello</span> — <span id="line">let's get to work.</span></h1>
  </header>

  <div class="kpis" id="kpis"></div>

  <div class="row" style="margin-bottom:14px"><h2 class="h2">Your study tools</h2></div>
  <div class="apps" id="apps"></div>

  <div class="side">
    <div class="card pad">
      <div class="row" style="margin-bottom:6px"><h3 class="h2">Recent activity</h3></div>
      <div id="activity"></div>
    </div>
    <div class="card pad">
      <div class="row" style="margin-bottom:12px"><h3 class="h2">Subjects</h3><span class="spacer"></span>
        <button class="btn sm primary" id="addSub">＋</button></div>
      <div id="subjects"></div>
      <div class="hr"></div>
      <div class="muted" style="font-size:12.5px;line-height:1.6">Subjects are shared across every app — colour-coded so your decks, notes, quizzes and tasks all line up.</div>
    </div>
  </div>

  <footer style="text-align:center;padding:50px 0 30px;color:var(--muted);font-size:13px">
    StudySet · everything saves locally in your browser · <a href="#" id="reset" style="color:var(--muted)">reset demo data</a>
  </footer>
</div>

<script>
const S=window.Suite; S.topbar("index");
const $=(s,r=document)=>r.querySelector(s);

/* greeting */
(function(){
  const h=new Date().getHours();
  $("#greet").textContent = h<5?"Late night":h<12?"Good morning":h<18?"Good afternoon":"Good evening";
  const focusToday=(S.Store.get("focusLog",{})[S.todayISO()])||0;
  $("#line").textContent = focusToday>0? `${S.fmtDur(focusToday)} focused today — keep it going.` : "let's get to work.";
})();

/* KPIs */
function renderKPIs(){
  // cards due
  let cardsDue=0; S.Store.get("decks",[]).forEach(d=>d.cards.forEach(c=>{ if((c.due||"9999")<=S.todayISO()) cardsDue++; }));
  // next exam
  const exams=S.Store.get("exams",[]).filter(e=>e.date>=S.todayISO()).sort((a,b)=>a.date.localeCompare(b.date));
  const next=exams[0]; const nd=next? S.daysBetween(S.todayISO(),next.date):null;
  // tasks today / overdue
  const tasks=S.Store.get("tasks",[]);
  const todayTasks=tasks.filter(t=>!t.done && (t.due===S.todayISO()||(t.due&&t.due<S.todayISO()))).length;
  // focus week
  const log=S.Store.get("focusLog",{}); let week=0; for(let i=0;i<7;i++){ const d=new Date(); d.setDate(d.getDate()-i); week+=log[d.toISOString().slice(0,10)]||0; }

  const kpis=[
    { n:cardsDue, l:"flashcards due", ic:"flashcards", href:"flashcards.html", tone:"accent" },
    { n: next? nd : "—", l: next? `days to ${next.name.length>16?next.name.slice(0,15)+"…":next.name}` : "no exams set", ic:"planner", href:"planner.html", tone: next&&nd<=3 ? "rose":"gold" },
    { n:todayTasks, l:todayTasks===1?"task to do":"tasks to do", ic:"check", href:"planner.html", tone: todayTasks>0 ? "rose":"accent" },
    { n:S.fmtDur(week), l:"focused this week", ic:"focus", href:"focus.html", tone:"green" },
  ];
  const wrap=$("#kpis"); wrap.innerHTML="";
  kpis.forEach((k,i)=>{ const a=document.createElement("a"); a.className="card lift kpi reveal tone-"+k.tone; a.href=k.href; a.style.animationDelay=(i*0.05)+"s";
    a.innerHTML=`<span class="ic">${S.icon(k.ic,18)}</span><span class="n">${k.n}</span><span class="l">${k.l}</span>`; wrap.appendChild(a); });
}

/* app cards */
const APP_INFO=[
  { file:"flashcards.html", ic:"flashcards", name:"Flashcards", desc:"Spaced-repetition decks that resurface cards right before you forget them." },
  { file:"quiz.html", ic:"quiz", name:"Quizzes", desc:"Build practice tests, take them timed, and review every miss." },
  { file:"notes.html", ic:"notes", name:"Notes", desc:"Cornell-style notes with cues, notes and a one-line summary." },
  { file:"planner.html", ic:"planner", name:"Planner", desc:"Exam countdowns, task board, and auto-built study schedules." },
  { file:"focus.html", ic:"focus", name:"Focus", desc:"Pomodoro timer that logs real study minutes and streaks." },
  { file:"reference.html", ic:"reference", name:"Sheets", desc:"Formula sheets & cheat sheets — collapsible, printable." },
];
function renderApps(){
  const wrap=$("#apps"); wrap.innerHTML="";
  const decks=S.Store.get("decks",[]), quizzes=S.Store.get("quizzes",[]), notes=S.Store.get("notes",[]), sheets=S.Store.get("sheets",[]);
  const counts={ "flashcards.html":decks.reduce((a,d)=>a+d.cards.length,0)+" cards", "quiz.html":quizzes.length+" quizzes",
    "notes.html":notes.length+" notes", "reference.html":sheets.length+" sheets" };
  APP_INFO.forEach((a,i)=>{ const el=document.createElement("a"); el.className="card lift app-card reveal"; el.href=a.file; el.style.animationDelay=(i*0.045)+"s";
    el.innerHTML=`<div class="glyph">${S.icon(a.ic,24)}</div><h3>${a.name}</h3><p>${a.desc}</p>
      <span class="app-go">Open <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></span>
      ${counts[a.file]?`<span class="badge2 badge">${counts[a.file]}</span>`:""}`; wrap.appendChild(el); });
}

/* activity feed */
function renderActivity(){
  const items=[];
  (S.Store.get("focusSessions",[])).slice(-20).forEach(s=> items.push({ ts:s.ts, ic:"focus", text:`Focused ${S.fmtDur(s.mins)}${s.subject?" on "+S.subjectName(s.subject):""}` }));
  (S.Store.get("quizResults",[])).forEach(r=> items.push({ ts: r.ts || new Date(r.date+"T12:00").getTime(), ic:"quiz", text:`Scored ${r.pct}% on ${r.name}` }));
  const rl=S.Store.get("reviewLog",{}); Object.keys(rl).forEach(d=> items.push({ ts:new Date(d+"T09:00").getTime(), ic:"flashcards", text:`Reviewed ${rl[d]} flashcards` }));
  (S.Store.get("notes",[])).forEach(n=> items.push({ ts:n.updated, ic:"notes", text:`Edited note “${n.title||"Untitled"}”` }));
  items.sort((a,b)=>b.ts-a.ts);
  const wrap=$("#activity"); wrap.innerHTML="";
  if(!items.length){ wrap.innerHTML=`<div class="empty" style="padding:24px"><div class="big">✎</div>No activity yet — open any tool to begin.</div>`; return; }
  items.slice(0,8).forEach(it=>{ const el=document.createElement("div"); el.className="activity-item";
    const when=timeAgo(it.ts);
    el.innerHTML=`<span class="ai">${S.icon(it.ic,16)}</span><span class="grow">${S.esc(it.text)}</span><span class="muted mono" style="font-size:12px">${when}</span>`; wrap.appendChild(el); });
}
function timeAgo(ts){ const s=(Date.now()-ts)/1000; if(s<60)return"just now"; if(s<3600)return Math.floor(s/60)+"m ago"; if(s<86400)return Math.floor(s/3600)+"h ago"; return Math.floor(s/86400)+"d ago"; }

/* subjects manager */
function renderSubjects(){
  const wrap=$("#subjects"); wrap.innerHTML="";
  S.subjects().forEach(s=>{ const c=document.createElement("span"); c.className="subj-chip";
    c.innerHTML=`<span class="sub-dot" style="background:${s.color}"></span>${S.esc(s.name)}<button title="Remove">✕</button>`;
    c.querySelector("button").onclick=()=>{ const list=S.subjects().filter(x=>x.id!==s.id); S.Store.set("subjects",list); renderSubjects(); renderKPIs(); };
    wrap.appendChild(c); });
}
$("#addSub").onclick=()=>{ const el=document.createElement("div");
  el.innerHTML=`<div class="field"><label>Subject name</label><input class="input" id="sn" placeholder="e.g. Physics"></div>`;
  S.modal({ title:"Add subject", bodyEl:el, okText:"Add", onOk:()=>{ const v=$("#sn",el).value.trim(); if(!v)return false; S.addSubject(v); renderSubjects(); } });
  setTimeout(()=>$("#sn",el).focus(),50);
};

$("#reset").onclick=(e)=>{ e.preventDefault(); S.confirmDialog("Clear all StudySet data and reload the demo? This can't be undone.", ()=>{
  Object.keys(localStorage).filter(k=>k.startsWith("studyset:")).forEach(k=>localStorage.removeItem(k));
  location.reload();
}, "Reset"); };

renderKPIs(); renderApps(); renderActivity(); renderSubjects();
</script>
</body>
</html>
