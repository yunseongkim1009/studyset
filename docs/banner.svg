<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" font-family="'Fraunces','Iowan Old Style',Palatino,Georgia,serif">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c6bf4"/><stop offset=".6" stop-color="#5646d6"/><stop offset="1" stop-color="#4535b8"/>
    </linearGradient>
    <radialGradient id="wash1" cx="1" cy="0" r="1"><stop offset="0" stop-color="#ece9fb"/><stop offset="1" stop-color="#f4efe6" stop-opacity="0"/></radialGradient>
    <radialGradient id="wash2" cx="0" cy="0" r="1"><stop offset="0" stop-color="#f6ecd7"/><stop offset="1" stop-color="#f4efe6" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#3a2c14" flood-opacity="0.14"/></filter>
    <filter id="soft2" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#3a2c14" flood-opacity="0.16"/></filter>
    <style>.i{fill:none;stroke:#fff;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}</style>
  </defs>

  <rect width="1280" height="440" rx="0" fill="#f4efe6"/>
  <rect width="1280" height="440" fill="url(#wash1)"/>
  <rect width="1280" height="440" fill="url(#wash2)"/>

  <!-- brand mark -->
  <g filter="url(#soft2)" transform="translate(96,86)">
    <rect width="70" height="70" rx="20" fill="url(#brand)"/>
    <text x="35" y="51" text-anchor="middle" font-size="44" font-weight="700" fill="#fff" letter-spacing="-1">S</text>
  </g>

  <!-- wordmark + tagline -->
  <text x="184" y="118" font-size="40" font-weight="600" fill="#201c17" letter-spacing="-.5">StudySet</text>
  <text x="185" y="150" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="16" font-weight="600" fill="#837a6b" letter-spacing="3">YOUR COMPLETE STUDY TOOLKIT</text>

  <!-- headline -->
  <text x="94" y="248" font-size="74" font-weight="600" fill="#201c17" letter-spacing="-1.5">Everything you need <tspan fill="#5646d6">to study,</tspan></text>
  <text x="94" y="322" font-size="74" font-weight="600" fill="#201c17" letter-spacing="-1.5">in <tspan fill="#5646d6">one</tspan> quiet place.</text>

  <!-- app icon tiles -->
  <g filter="url(#soft)" transform="translate(96,368)">
    <g transform="translate(0,0)"><rect width="52" height="52" rx="15" fill="url(#brand)"/>
      <g class="i" transform="translate(11,11) scale(1.25)"><rect x="1.6" y="3.6" width="10" height="7.4" rx="1.7" transform="rotate(-6 6.6 7.3)"/><rect x="4.3" y="5" width="10" height="7.4" rx="1.7"/><path d="M6.6 8.3h5.3M6.6 10h3.3"/></g></g>
    <g transform="translate(66,0)"><rect width="52" height="52" rx="15" fill="url(#brand)"/>
      <g class="i" transform="translate(13,12.5) scale(1.1)"><path d="M9 11.5l2 2 4-4.5"/><rect x="4" y="3.5" width="16" height="17" rx="2.5" transform="translate(-4,-3.5)"/><path d="M5 0h6v2.5H5z" transform="translate(0,0)"/></g></g>
    <g transform="translate(132,0)"><rect width="52" height="52" rx="15" fill="url(#brand)"/>
      <g class="i" transform="translate(13,13) scale(1.1)"><path d="M12 6.5C10.5 5 8 4.5 4 4.7v13c4-.2 6.5.3 8 1.8 1.5-1.5 4-2 8-1.8v-13c-4-.2-6.5.3-8 1.8z" transform="translate(-4,-4)"/><path d="M8 2.5V15" /></g></g>
    <g transform="translate(198,0)"><rect width="52" height="52" rx="15" fill="url(#brand)"/>
      <g class="i" transform="translate(13,13) scale(1.05)"><rect x="0" y="1" width="17" height="16" rx="2.5"/><path d="M0 5.5h17M4.5 -1v4M12.5 -1v4"/><path d="M4 9.5h3M4 13h6"/></g></g>
    <g transform="translate(264,0)"><rect width="52" height="52" rx="15" fill="url(#brand)"/>
      <g class="i" transform="translate(13,13) scale(1.05)"><circle cx="8" cy="9.5" r="7.5"/><path d="M8 9.5V5M5.5 -1.5h5M14.5 2l1.5-1.5"/></g></g>
    <g transform="translate(330,0)"><rect width="52" height="52" rx="15" fill="url(#brand)"/>
      <g class="i" transform="translate(13,13) scale(1.05)"><path d="M0 0h7a2.5 2.5 0 012.5 2.5V16a2 2 0 00-2-2H0z"/><path d="M16 0H9a2.5 2.5 0 00-2.5 2.5" transform="translate(-6.5,0)"/></g></g>
  </g>

  <!-- caption -->
  <text x="520" y="400" font-family="Inter,ui-sans-serif,system-ui,sans-serif" font-size="16" fill="#837a6b">Flashcards · Quizzes · Notes · Planner · Focus · Sheets — one shared, offline-first workspace.</text>
</svg>
