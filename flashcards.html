<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flashcards · StudySet</title>
<link rel="stylesheet" href="suite.css">
<style>
  .layout { display: grid; grid-template-columns: 300px 1fr; gap: 22px; padding: 26px 0 60px; align-items: start; }
  .deck { padding: 14px 15px; border-radius: var(--r); border: 1px solid var(--line); background: var(--card);
          cursor: pointer; margin-bottom: 10px; transition: .15s; }
  .deck:hover { border-color: var(--accent); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
  .deck.active { border-color: var(--accent); background: var(--accent-wash); }
  .deck h4 { margin: 0 0 4px; font-size: 15px; display: flex; align-items: center; gap: 8px; }
  .deck .meta { font-size: 12px; color: var(--muted); display: flex; gap: 10px; }
  .due-pill { margin-left: auto; background: var(--accent); color: var(--accent-ink); font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; }

  /* study card */
  .stage { display: grid; place-items: center; min-height: 340px; }
  .flashcard { width: 100%; max-width: 520px; height: 300px; perspective: 1600px; cursor: pointer; }
  .fc-inner { position: relative; width: 100%; height: 100%; transition: transform .5s cubic-bezier(.2,.8,.2,1); transform-style: preserve-3d; }
  .flashcard.flipped .fc-inner { transform: rotateY(180deg); }
  .fc-face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: var(--r-xl);
             display: grid; place-items: center; text-align: center; padding: 34px; border: 1px solid var(--line);
             box-shadow: var(--shadow-md); background: var(--card); }
  .fc-face .side { position: absolute; top: 16px; left: 20px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .fc-face .txt { font-family: var(--serif); font-size: clamp(20px, 3.4vw, 30px); line-height: 1.25; }
  .fc-back { transform: rotateY(180deg); background: var(--card-2); }
  .fc-hint { text-align: center; color: var(--muted); font-size: 13px; margin-top: 14px; }
  .grade-row { display: flex; gap: 10px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
  .grade { flex: 1; min-width: 90px; max-width: 150px; }
  .grade.again { color: var(--rose); } .grade.again:hover { border-color: var(--rose); }
  .grade.hard  { color: var(--gold); } .grade.hard:hover  { border-color: var(--gold); }
  .grade.good  { color: var(--sky);  } .grade.good:hover  { border-color: var(--sky); }
  .grade.easy  { color: var(--green);} .grade.easy:hover  { border-color: var(--green); }
  .grade small { display:block; font-weight:500; font-size:11px; color:var(--muted); }

  .cardrow { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border: 1px solid var(--line-soft); border-radius: var(--r-sm); margin-bottom: 8px; }
  .cardrow .q { font-weight: 600; } .cardrow .a { color: var(--muted); font-size: 14px; }
  .box-tag { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 6px; background: var(--card-2); border: 1px solid var(--line); color: var(--muted); }
  @media (max-width: 820px){ .layout { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<script src="suite.js"></script>
<div class="wrap">
  <div class="layout">
    <!-- sidebar: decks -->
    <aside>
      <div class="row" style="margin-bottom:12px">
        <h1 class="h2">Decks</h1>
        <span class="spacer"></span>
        <button class="btn sm primary" id="newDeck">＋ New</button>
      </div>
      <div id="deckList"></div>
      <div class="card pad" style="margin-top:16px" id="dueBanner" hidden>
        <div class="eyebrow">Ready to review</div>
        <div style="font-size:26px;font-weight:700;margin:4px 0" id="dueTotal">0</div>
        <div class="muted" style="font-size:13px">cards due across all decks</div>
      </div>
    </aside>

    <!-- main -->
    <main id="main"></main>
  </div>
</div>

<script>
const S = window.Suite;
S.topbar("flashcards");
const $ = (s, r=document) => r.querySelector(s);

/* ---------- SRS: Leitner-style, 5 boxes ---------- */
const INTERVALS = [0, 1, 2, 4, 8, 16]; // box -> days until due (box 1..5), box 0 = new
function newCard(front, back) {
  return { id: S.uid("c"), front, back, box: 0, due: S.todayISO(), reps: 0, lapses: 0 };
}
function grade(card, g) {
  // g: 0 again, 1 hard, 2 good, 3 easy
  card.reps++;
  if (g === 0) { card.box = 1; card.lapses++; }
  else if (g === 1) { card.box = Math.max(1, card.box); }
  else if (g === 2) { card.box = Math.min(5, (card.box || 1) + 1); }
  else { card.box = Math.min(5, (card.box || 1) + 2); }
  const days = INTERVALS[card.box] || 1;
  const d = new Date(); d.setDate(d.getDate() + (g === 0 ? 0 : days));
  card.due = d.toISOString().slice(0, 10);
  if (g === 0) card.due = S.todayISO(); // again -> still today
}
const isDue = (c) => c.due <= S.todayISO();

/* ---------- data ---------- */
function decks() { return S.Store.get("decks", null) || seed(); }
function saveDecks(d) { S.Store.set("decks", d); }
function seed() {
  const d = [
    { id: S.uid("d"), name: "Cell Biology", subject: "s_bio", cards: [
      newCard("What organelle is the powerhouse of the cell?", "The mitochondrion — it produces ATP via cellular respiration."),
      newCard("What is the function of ribosomes?", "Protein synthesis (translation of mRNA into polypeptides)."),
      newCard("Define osmosis.", "Diffusion of water across a semipermeable membrane, from low to high solute concentration."),
      newCard("What separates the nucleus from the cytoplasm?", "The nuclear envelope (a double membrane with nuclear pores)."),
    ]},
    { id: S.uid("d"), name: "SAT Vocabulary", subject: "", cards: [
      newCard("Ephemeral", "Lasting a very short time; fleeting."),
      newCard("Pragmatic", "Dealing with things sensibly and realistically."),
      newCard("Ubiquitous", "Present, appearing, or found everywhere."),
    ]},
  ];
  saveDecks(d); return d;
}

let activeId = null, session = null;

/* ---------- render deck list ---------- */
function renderDecks() {
  const list = $("#deckList"); list.innerHTML = "";
  const ds = decks();
  let totalDue = 0;
  ds.forEach((d) => {
    const due = d.cards.filter(isDue).length;
    totalDue += due;
    const el = document.createElement("div");
    el.className = "deck" + (d.id === activeId ? " active" : "");
    const col = S.subjectColor(d.subject);
    el.innerHTML = `<h4><span class="sub-dot" style="background:${col}"></span>${S.esc(d.name)}
        ${due ? `<span class="due-pill">${due}</span>` : ""}</h4>
      <div class="meta"><span>${d.cards.length} cards</span><span>${S.subjectName(d.subject)}</span></div>`;
    el.onclick = () => { activeId = d.id; session = null; renderDecks(); renderMain(); };
    list.appendChild(el);
  });
  if (!ds.length) list.innerHTML = `<div class="muted" style="font-size:13px;padding:8px">No decks yet.</div>`;
  const banner = $("#dueBanner");
  banner.hidden = totalDue === 0;
  $("#dueTotal").textContent = totalDue;
}

/* ---------- main views ---------- */
function renderMain() {
  const main = $("#main");
  if (session) { renderStudy(); return; }
  const d = decks().find((x) => x.id === activeId);
  if (!d) { main.innerHTML = welcome(); wireWelcome(); return; }
  renderDeckDetail(d);
}

function welcome() {
  const ds = decks();
  const total = ds.reduce((a, d) => a + d.cards.length, 0);
  return `<div class="card pad fade">
    <div class="eyebrow">Flashcards</div>
    <h2 class="h1" style="margin:6px 0 8px">Spaced repetition that sticks.</h2>
    <p class="lead" style="max-width:52ch">Cards you find hard come back sooner; cards you know drift into the future. Grade honestly and let the boxes do the scheduling.</p>
    <div class="row" style="gap:10px;margin-top:16px">
      <button class="btn primary lg" id="studyAll">Study all due</button>
      <button class="btn lg" id="wNew">＋ New deck</button>
    </div>
    <div class="hr"></div>
    <div class="muted" style="font-size:13px">${ds.length} decks · ${total} cards · pick a deck on the left to start.</div>
  </div>`;
}
function wireWelcome() {
  const b = $("#studyAll"); if (b) b.onclick = studyAllDue;
  const n = $("#wNew"); if (n) n.onclick = createDeck;
}

function renderDeckDetail(d) {
  const due = d.cards.filter(isDue).length;
  const byBox = [0,0,0,0,0,0];
  d.cards.forEach((c) => byBox[c.box || 0]++);
  $("#main").innerHTML = `
    <div class="row" style="gap:12px;margin-bottom:16px">
      <div>
        <div class="eyebrow" style="color:${S.subjectColor(d.subject)}">${S.subjectName(d.subject)}</div>
        <h1 class="h1" style="font-size:30px">${S.esc(d.name)}</h1>
      </div>
      <span class="spacer"></span>
      <button class="btn sm ghost" id="renameDeck">Rename</button>
      <button class="btn sm danger" id="delDeck">Delete</button>
    </div>
    <div class="card pad" style="margin-bottom:16px">
      <div class="row" style="gap:20px;flex-wrap:wrap">
        <div><div style="font-size:30px;font-weight:700;font-family:var(--serif)">${due}</div><div class="muted" style="font-size:13px">due now</div></div>
        <div><div style="font-size:30px;font-weight:700;font-family:var(--serif)">${d.cards.length}</div><div class="muted" style="font-size:13px">total cards</div></div>
        <div class="grow"></div>
        <button class="btn lg primary" id="startStudy" ${due?"":"disabled"}>${due?`Review ${due} due`:"Nothing due"}</button>
        <button class="btn lg" id="cram">Cram all</button>
      </div>
    </div>
    <div class="card pad">
      <div class="row" style="margin-bottom:12px"><h3 class="h2">Cards</h3><span class="spacer"></span>
        <button class="btn sm primary" id="addCard">＋ Add card</button></div>
      <div id="cards"></div>
    </div>`;
  $("#startStudy").onclick = () => startSession(d, d.cards.filter(isDue));
  $("#cram").onclick = () => startSession(d, d.cards.slice(), true);
  $("#addCard").onclick = () => editCard(d, null);
  $("#renameDeck").onclick = () => renameDeck(d);
  $("#delDeck").onclick = () => S.confirmDialog(`Delete “${S.esc(d.name)}” and its ${d.cards.length} cards?`, () => {
    saveDecks(decks().filter((x) => x.id !== d.id)); activeId = null; renderDecks(); renderMain(); S.toast("Deck deleted");
  });
  const wrap = $("#cards"); wrap.innerHTML = "";
  if (!d.cards.length) wrap.innerHTML = `<div class="empty"><div class="big">▤</div>No cards yet — add your first one.</div>`;
  d.cards.forEach((c) => {
    const row = document.createElement("div"); row.className = "cardrow";
    row.innerHTML = `<div class="grow"><div class="q">${S.esc(c.front)}</div><div class="a">${S.esc(c.back)}</div></div>
      <span class="box-tag" title="Leitner box">${c.box ? "box "+c.box : "new"}</span>
      <button class="icon-btn" style="width:30px;height:30px" data-edit>✎</button>
      <button class="icon-btn" style="width:30px;height:30px" data-del>✕</button>`;
    row.querySelector("[data-edit]").onclick = () => editCard(d, c);
    row.querySelector("[data-del]").onclick = () => {
      d.cards = d.cards.filter((x) => x.id !== c.id); saveDecks(decks()); renderDecks(); renderMain();
    };
    wrap.appendChild(row);
  });
}

/* ---------- study session ---------- */
function startSession(deck, cards, cram) {
  if (!cards.length) return;
  // sort: due date then box
  const queue = cards.slice().sort((a,b)=> (a.due<b.due?-1:1) || (a.box-b.box));
  session = { deck, queue, i: 0, flipped: false, done: 0, total: queue.length, cram: !!cram, correct: 0 };
  activeId = deck.id;
  renderMain();
}
function studyAllDue() {
  const all = [];
  decks().forEach((d) => d.cards.filter(isDue).forEach((c) => all.push({ c, d })));
  if (!all.length) return S.toast("Nothing due — nice work!");
  // synthesize a virtual session across decks
  const queue = all.map(x => x.c);
  const deckMap = {}; all.forEach(x => deckMap[x.c.id] = x.d);
  session = { deck: null, deckMap, queue, i:0, flipped:false, done:0, total:queue.length, cram:false, correct:0 };
  activeId = null; renderDecks(); renderMain();
}

function renderStudy(deckMaybe) {
  const ss = session;
  if (ss.i >= ss.queue.length) return renderSummary();
  const card = ss.queue[ss.i];
  const pct = Math.round((ss.done / ss.total) * 100);
  $("#main").innerHTML = `
    <div class="row" style="margin-bottom:14px">
      <button class="btn sm ghost" id="quit">‹ End</button>
      <span class="spacer"></span>
      <span class="chip">${ss.done} / ${ss.total}</span>
    </div>
    <div class="bar" style="margin-bottom:22px"><i style="width:${pct}%"></i></div>
    <div class="stage">
      <div style="width:100%;max-width:520px">
        <div class="flashcard ${ss.flipped?"flipped":""}" id="fc">
          <div class="fc-inner">
            <div class="fc-face"><span class="side">Prompt</span><div class="txt">${S.esc(card.front)}</div></div>
            <div class="fc-face fc-back"><span class="side">Answer</span><div class="txt">${S.esc(card.back)}</div></div>
          </div>
        </div>
        <div class="fc-hint">${ss.flipped ? "How well did you know it?" : "Click the card or press <span class='kbd'>Space</span> to flip"}</div>
        <div class="grade-row" id="grades" ${ss.flipped?"":"style=visibility:hidden"}>
          <button class="btn grade again" data-g="0">Again<small>&lt;1m</small></button>
          <button class="btn grade hard"  data-g="1">Hard<small>1d</small></button>
          <button class="btn grade good"  data-g="2">Good<small>${INTERVALS[Math.min(5,(card.box||1)+1)]}d</small></button>
          <button class="btn grade easy"  data-g="3">Easy<small>${INTERVALS[Math.min(5,(card.box||1)+2)]}d</small></button>
        </div>
      </div>
    </div>`;
  const fc = $("#fc");
  fc.onclick = flip;
  $("#quit").onclick = () => { session = null; renderDecks(); renderMain(); };
  $("#grades").querySelectorAll("[data-g]").forEach((b) => b.onclick = () => doGrade(+b.dataset.g));
}
function flip() { if (!session) return; session.flipped = !session.flipped; renderStudy(); }
function doGrade(g) {
  const ss = session; const card = ss.queue[ss.i];
  grade(card, g);
  if (g >= 2) ss.correct++;
  ss.done++;
  saveDecks(decks());
  // log a review for hub stats
  const log = S.Store.get("reviewLog", {});
  const t = S.todayISO(); log[t] = (log[t] || 0) + 1; S.Store.set("reviewLog", log);
  if (g === 0) { ss.queue.push(card); } // requeue "again"
  ss.i++; ss.flipped = false;
  renderStudy();
}
function renderSummary() {
  const ss = session;
  const acc = ss.done ? Math.round((ss.correct / ss.done) * 100) : 0;
  $("#main").innerHTML = `<div class="card pad fade" style="text-align:center;padding:44px">
    <div style="font-size:44px">✦</div>
    <h2 class="h1" style="margin:8px 0">Session complete</h2>
    <p class="lead">You reviewed <b>${ss.done}</b> cards · ${acc}% rated Good or better.</p>
    <div class="row" style="justify-content:center;gap:10px;margin-top:18px">
      <button class="btn primary lg" id="again">Back to decks</button>
    </div></div>`;
  $("#again").onclick = () => { session = null; renderDecks(); renderMain(); };
}

document.addEventListener("keydown", (e) => {
  if (!session || session.i >= session.queue.length) return;
  if (e.code === "Space") { e.preventDefault(); flip(); }
  else if (session.flipped && ["1","2","3","4"].includes(e.key)) doGrade(+e.key - 1);
});

/* ---------- CRUD ---------- */
function createDeck() {
  const el = document.createElement("div");
  const sel = S.subjectSelect({ allowNone: true });
  el.innerHTML = `<div class="field"><label>Deck name</label><input class="input" id="dn" placeholder="e.g. French verbs, Unit 4 vocab"></div>
    <div class="field"><label>Subject</label></div>`;
  el.appendChild(sel);
  S.modal({ title: "New deck", bodyEl: el, okText: "Create", onOk: () => {
    const name = $("#dn", el).value.trim(); if (!name) return false;
    const d = { id: S.uid("d"), name, subject: sel.value, cards: [] };
    const all = decks(); all.unshift(d); saveDecks(all); activeId = d.id;
    renderDecks(); renderMain(); S.toast("Deck created");
  }});
  setTimeout(() => $("#dn", el).focus(), 50);
}
$("#newDeck").onclick = createDeck;

function renameDeck(d) {
  const el = document.createElement("div");
  const sel = S.subjectSelect({ allowNone: true, value: d.subject });
  el.innerHTML = `<div class="field"><label>Deck name</label><input class="input" id="rn" value="${S.esc(d.name)}"></div><div class="field"><label>Subject</label></div>`;
  el.appendChild(sel);
  S.modal({ title: "Edit deck", bodyEl: el, okText: "Save", onOk: () => {
    const name = $("#rn", el).value.trim(); if (!name) return false;
    d.name = name; d.subject = sel.value; saveDecks(decks()); renderDecks(); renderMain();
  }});
}
function editCard(d, c) {
  const el = document.createElement("div");
  el.innerHTML = `<div class="field"><label>Front (prompt)</label><textarea class="textarea" id="cf">${c?S.esc(c.front):""}</textarea></div>
    <div class="field"><label>Back (answer)</label><textarea class="textarea" id="cb">${c?S.esc(c.back):""}</textarea></div>`;
  S.modal({ title: c ? "Edit card" : "Add card", bodyEl: el, okText: c?"Save":"Add", onOk: () => {
    const f = $("#cf", el).value.trim(), b = $("#cb", el).value.trim();
    if (!f || !b) return false;
    if (c) { c.front = f; c.back = b; } else d.cards.push(newCard(f, b));
    saveDecks(decks()); renderDecks(); renderMain();
  }});
  setTimeout(() => $("#cf", el).focus(), 50);
}

renderDecks(); renderMain();
</script>
</body>
</html>
