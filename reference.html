<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sheets · StudySet</title>
<link rel="stylesheet" href="suite.css">
<style>
  .layout { display: grid; grid-template-columns: 260px 1fr; gap: 22px; padding: 22px 0 60px; align-items: start; }
  .sheet-item { padding: 12px 13px; border-radius: var(--r); border: 1px solid transparent; cursor: pointer; margin-bottom: 4px; transition:.12s; }
  .sheet-item:hover { background: var(--card-2); }
  .sheet-item.active { background: var(--accent-wash); border-color: var(--accent); }
  .sheet-item h4 { margin:0 0 2px; font-size:14.5px; }
  .sheet-item .meta { font-size:11.5px; color:var(--muted); }

  .sheet { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
  .sheet-hd { padding: 20px 22px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, var(--card-2), var(--card)); }
  .sheet-title { font-family: var(--serif); font-size: 28px; font-weight: 800; border:none; background:transparent; outline:none; width:100%; color:var(--ink); }
  .sec { border-bottom: 1px solid var(--line-soft); }
  .sec-hd { display:flex; align-items:center; gap:8px; padding: 12px 22px; cursor: pointer; user-select:none; }
  .sec-hd:hover { background: var(--card-2); }
  .sec-hd .caret { transition:.2s; color:var(--muted); }
  .sec.collapsed .caret { transform: rotate(-90deg); }
  .sec-hd h3 { margin:0; font-size:16px; font-family:var(--serif); }
  .sec-body { padding: 0 22px 16px; }
  .sec.collapsed .sec-body { display:none; }
  .sec-hd input.h { border:none;background:transparent;outline:none;font-family:var(--serif);font-size:16px;font-weight:700;color:var(--ink);flex:1; }
  .sec-body textarea { width:100%; border:1px solid transparent; background:transparent; outline:none; resize:none; font-family:var(--mono); font-size:13.5px; line-height:1.7; color:var(--ink); border-radius:8px; padding:8px; min-height:60px; }
  .sec-body textarea:focus { background: var(--card-2); border-color: var(--line); }
  .rendered { white-space:pre-wrap; line-height:1.7; font-size:15px; }
  .rendered code, .rendered .kbdi { font-family:var(--mono); background:var(--card-2); border:1px solid var(--line-soft); padding:1px 6px; border-radius:6px; font-size:.9em; }
  .rendered b { color: var(--accent); }
  .view-toggle .btn.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }

  @media (max-width: 820px){ .layout { grid-template-columns: 1fr; } }
  @media print {
    .topbar, aside, .no-print { display:none !important; }
    .layout { display:block; padding:0; } body{ background:#fff; }
    .sheet { border:none; box-shadow:none; }
  }
</style>
</head>
<body>
<script src="suite.js"></script>
<div class="wrap"><div class="layout">
  <aside>
    <div class="row" style="margin-bottom:10px"><h1 class="h2">Sheets</h1><span class="spacer"></span>
      <button class="btn sm primary" id="new">＋ New</button></div>
    <div id="list"></div>
    <p class="muted" style="font-size:12px;margin-top:14px;line-height:1.5">Cheat sheets &amp; formula references. Use <span class="kbd">**bold**</span>, <span class="kbd">\`code\`</span>, and bullet lines.</p>
  </aside>
  <main id="main"></main>
</div></div>

<script>
const S=window.Suite; S.topbar("reference");
const $=(s,r=document)=>r.querySelector(s);

function sheets(){ return S.Store.get("sheets", null) || seed(); }
function save(x){ S.Store.set("sheets", x); }
function seed(){
  const x=[{
    id:S.uid("sh"), title:"Calculus Derivative Rules", subject:"s_math", view:"read",
    sections:[
      { id:S.uid("se"), h:"Core rules", body:"**Power rule:** d/dx[xⁿ] = n·xⁿ⁻¹\n**Constant:** d/dx[c] = 0\n**Sum:** (f+g)' = f' + g'\n**Product:** (fg)' = f'g + fg'\n**Quotient:** (f/g)' = (f'g − fg')/g²", collapsed:false },
      { id:S.uid("se"), h:"Chain rule", body:"d/dx[f(g(x))] = f'(g(x))·g'(x)\n\nExample: d/dx[sin(x²)] = cos(x²)·2x", collapsed:false },
      { id:S.uid("se"), h:"Common derivatives", body:"d/dx[sin x] = cos x\nd/dx[cos x] = −sin x\nd/dx[eˣ] = eˣ\nd/dx[ln x] = 1/x", collapsed:false },
    ],
  }];
  save(x); return x;
}

let activeId=null;

function renderList(){
  const wrap=$("#list"); wrap.innerHTML="";
  const xs=sheets();
  if(!xs.length){ wrap.innerHTML=`<div class="muted" style="font-size:13px;padding:8px">No sheets yet.</div>`; }
  xs.forEach(s=>{
    const el=document.createElement("div"); el.className="sheet-item"+(s.id===activeId?" active":"");
    el.innerHTML=`<h4>${S.esc(s.title||"Untitled")}</h4><div class="meta"><span class="sub-dot" style="background:${S.subjectColor(s.subject)};display:inline-block;margin-right:5px"></span>${S.subjectName(s.subject)} · ${s.sections.length} sections</div>`;
    el.onclick=()=>{ activeId=s.id; renderList(); renderMain(); };
    wrap.appendChild(el);
  });
}

function fmt(text){
  let t=S.esc(text);
  t=t.replace(/\*\*([^*]+)\*\*/g,"<b>$1</b>");
  t=t.replace(/`([^`]+)`/g,'<code>$1</code>');
  t=t.replace(/^\s*[-•]\s+(.*)$/gm,"• $1");
  return t;
}

function renderMain(){
  const s=sheets().find(x=>x.id===activeId);
  const main=$("#main");
  if(!s){ main.innerHTML=`<div class="sheet"><div style="padding:60px 20px" class="empty"><div class="big">❋</div>Pick a sheet or create one.<br><span style="font-size:13px">Great for formulas, definitions, key dates, verb tables.</span></div></div>`; return; }
  const editing = s.view!=="read";
  main.innerHTML=`
    <div class="row no-print" style="gap:8px;margin-bottom:14px">
      <div class="view-toggle row" style="gap:6px">
        <button class="btn sm ${!editing?'on':''}" id="vRead">Read</button>
        <button class="btn sm ${editing?'on':''}" id="vEdit">Edit</button>
      </div>
      <span class="spacer"></span>
      <button class="btn sm" id="print">⎙ Print</button>
      <button class="btn sm danger" id="del">Delete</button>
    </div>
    <div class="sheet" id="sheet">
      <div class="sheet-hd">
        <div class="row" style="gap:10px">
          ${editing? `<input class="sheet-title" id="ttl" value="${S.esc(s.title)}">` : `<div class="sheet-title" style="padding:0">${S.esc(s.title||"Untitled")}</div>`}
          <div class="field no-print" style="min-width:150px" id="subw"></div>
        </div>
      </div>
      <div id="secs"></div>
      ${editing? `<div class="no-print" style="padding:14px 22px"><button class="btn sm block" id="addSec">＋ Add section</button></div>`:""}
    </div>`;
  if(editing){
    const sel=S.subjectSelect({allowNone:true,value:s.subject}); sel.classList.add("sm"); $("#subw").appendChild(sel);
    sel.onchange=()=>{ s.subject=sel.value; save(sheets()); renderList(); };
    $("#ttl").oninput=(e)=>{ s.title=e.target.value; save(sheets()); renderList(); };
    $("#addSec").onclick=()=>{ s.sections.push({ id:S.uid("se"), h:"New section", body:"", collapsed:false }); save(sheets()); renderMain(); };
  } else { $("#subw").style.display="none"; }
  $("#vRead").onclick=()=>{ s.view="read"; save(sheets()); renderMain(); };
  $("#vEdit").onclick=()=>{ s.view="edit"; save(sheets()); renderMain(); };
  $("#print").onclick=()=>window.print();
  $("#del").onclick=()=>S.confirmDialog(`Delete “${S.esc(s.title||"Untitled")}”?`,()=>{ save(sheets().filter(x=>x.id!==s.id)); activeId=null; renderList(); renderMain(); S.toast("Sheet deleted"); });

  const secs=$("#secs"); secs.innerHTML="";
  s.sections.forEach((sec,i)=>{
    const el=document.createElement("div"); el.className="sec"+(sec.collapsed?" collapsed":"");
    if(editing){
      el.innerHTML=`<div class="sec-hd"><span class="caret">▾</span><input class="h" value="${S.esc(sec.h)}">
        <button class="icon-btn no-print" style="width:28px;height:28px" data-up>↑</button>
        <button class="icon-btn no-print" style="width:28px;height:28px" data-rm>✕</button></div>
        <div class="sec-body"><textarea placeholder="Content… use **bold**, \`code\`, and bullet lines">${S.esc(sec.body)}</textarea></div>`;
      el.querySelector(".caret").onclick=()=>{ sec.collapsed=!sec.collapsed; save(sheets()); renderMain(); };
      el.querySelector(".h").oninput=(e)=>{ sec.h=e.target.value; save(sheets()); };
      const ta=el.querySelector("textarea");
      const grow=()=>{ ta.style.height="auto"; ta.style.height=Math.max(60,ta.scrollHeight)+"px"; };
      ta.oninput=()=>{ sec.body=ta.value; save(sheets()); grow(); }; setTimeout(grow,0);
      el.querySelector("[data-rm]").onclick=()=>{ s.sections.splice(i,1); save(sheets()); renderMain(); };
      el.querySelector("[data-up]").onclick=()=>{ if(i>0){ [s.sections[i-1],s.sections[i]]=[s.sections[i],s.sections[i-1]]; save(sheets()); renderMain(); } };
    } else {
      el.innerHTML=`<div class="sec-hd"><span class="caret">▾</span><h3>${S.esc(sec.h)}</h3></div>
        <div class="sec-body"><div class="rendered">${fmt(sec.body)}</div></div>`;
      el.querySelector(".sec-hd").onclick=()=>{ sec.collapsed=!sec.collapsed; el.classList.toggle("collapsed"); save(sheets()); };
    }
    secs.appendChild(el);
  });
}

$("#new").onclick=()=>{ const s={ id:S.uid("sh"), title:"", subject:"", view:"edit", sections:[{ id:S.uid("se"), h:"Section 1", body:"", collapsed:false }] };
  const all=sheets(); all.unshift(s); save(all); activeId=s.id; renderList(); renderMain(); setTimeout(()=>$("#ttl")&&$("#ttl").focus(),50); };

renderList(); renderMain();
</script>
</body>
</html>
